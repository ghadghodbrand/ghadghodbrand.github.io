
<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GHADGHOD Dashboard</title><link rel="stylesheet" href="styles.css"></head>
<body class="admin"><div class="admin-wrap"><aside class="side"><img src="logo.png"><h3>لوحة التحكم</h3><button class="active" onclick="showTab('overview',this)">📊 الرئيسية</button><button onclick="showTab('productsTab',this)">🛍️ المنتجات</button><button onclick="showTab('ordersTab',this)">📦 الطلبات</button><button onclick="showTab('settingsTab',this)">🎨 إعدادات المتجر</button><a class="btn cyan" style="display:block;text-align:center;margin-top:20px" href="index.html">فتح المتجر</a></aside>
<main class="admin-main"><div id="overview"><h1>مرحبًا بك 👋</h1><div class="dash-grid"><div class="stat">المنتجات<strong id="statProducts">0</strong></div><div class="stat">الطلبات<strong id="statOrders">0</strong></div><div class="stat">إجمالي الطلبات<strong id="statSales">0</strong></div><div class="stat">عربون مستحق<strong id="statDeposits">0</strong></div></div><div class="admin-card"><h2>نظرة سريعة</h2><p class="muted">هذه نسخة مجانية أولية. البيانات محفوظة محليًا في المتصفح، ومناسبة للتجربة والتصميم قبل ربط قاعدة بيانات حقيقية.</p></div></div>
<div id="productsTab" class="hide"><h1>المنتجات</h1><div class="admin-card"><form class="form" onsubmit="addProduct(event)"><div class="two"><input name="nameAr" required placeholder="اسم المنتج بالعربي"><input name="nameEn" placeholder="Product name in English"></div><div class="two"><input name="price" type="number" required placeholder="السعر بالجنيه"><input name="cat" placeholder="القسم"></div><input name="img" placeholder="رابط صورة المنتج (يمكن إضافة رفع صور لاحقًا)"><button class="btn" type="submit">+ إضافة المنتج</button></form></div><div class="admin-card" id="adminProducts"></div></div>
<div id="ordersTab" class="hide"><h1>الطلبات</h1><div class="admin-card"><div style="overflow:auto"><table class="table"><thead><tr><th>الطلب</th><th>العميل</th><th>الدفع</th><th>الإجمالي</th><th>الحالة</th></tr></thead><tbody id="adminOrders"></tbody></table></div></div></div>
<div id="settingsTab" class="hide"><h1>إعدادات المتجر</h1><div class="admin-card"><form class="form" onsubmit="saveSettings(event)"><input name="store" id="storeName" placeholder="اسم المتجر"><input name="whatsapp" id="wa" placeholder="WhatsApp بدون +"><div class="color-row"><label>الوردي</label><input type="color" name="pink" id="pink"><label>التركواز</label><input type="color" name="cyan" id="cyan"><label>النص</label><input type="color" name="ink" id="ink"></div><button class="btn cyan">حفظ الإعدادات</button></form></div></div>
</main></div>
<script src="app.js"></script><script>
function showTab(id,b){document.querySelectorAll(".admin-main>div").forEach(x=>x.classList.add("hide"));document.getElementById(id).classList.remove("hide");document.querySelectorAll(".side button").forEach(x=>x.classList.remove("active"));b.classList.add("active");refreshAdmin()}
function refreshAdmin(){document.getElementById("statProducts").textContent=data.products.length;document.getElementById("statOrders").textContent=data.orders.length;document.getElementById("statSales").textContent=money(data.orders.reduce((a,o)=>a+o.total,0));document.getElementById("statDeposits").textContent=money(data.orders.filter(o=>o.payment==="cod").reduce((a,o)=>a+o.deposit,0));document.getElementById("adminProducts").innerHTML=data.products.map(p=>`<div class="product-admin"><div>${p.img?`<img src="${p.img}">`:"🛍️"}</div><div><b>${p.nameAr}</b><div class="muted">${p.cat||""} • ${money(p.price)}</div></div><button class="btn dark" onclick="removeProduct(${p.id})">حذف</button></div>`).join("");document.getElementById("adminOrders").innerHTML=data.orders.map(o=>`<tr><td>#${String(o.id).slice(-5)}</td><td>${o.name}<br>${o.phone}</td><td>${o.payment==="cod"?"استلام + عربون":"أونلاين"}</td><td>${money(o.total)}</td><td><select onchange="setStatus(${o.id},this.value)">${["جديد","تم التأكيد","قيد التجهيز","تم الشحن","تم التسليم","ملغي"].map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}</select></td></tr>`).join("");document.getElementById("storeName").value=data.settings.store;document.getElementById("wa").value=data.settings.whatsapp;document.getElementById("pink").value=data.settings.pink;document.getElementById("cyan").value=data.settings.cyan;document.getElementById("ink").value=data.settings.ink}
function addProduct(e){e.preventDefault();let f=new FormData(e.target);data.products.push({id:Date.now(),nameAr:f.get("nameAr"),nameEn:f.get("nameEn")||f.get("nameAr"),price:Number(f.get("price")),cat:f.get("cat")||"عام",img:f.get("img")||""});save();e.target.reset();refreshAdmin();alert("تمت إضافة المنتج")}
function removeProduct(id){if(confirm("حذف المنتج؟")){data.products=data.products.filter(p=>p.id!==id);save();refreshAdmin()}}
function setStatus(id,s){let o=data.orders.find(x=>x.id===id);if(o)o.status=s;save()}
function saveSettings(e){e.preventDefault();let f=new FormData(e.target);data.settings={store:f.get("store"),whatsapp:f.get("whatsapp"),pink:f.get("pink"),cyan:f.get("cyan"),ink:f.get("ink")};save();applyTheme();alert("تم حفظ الإعدادات")}
refreshAdmin();
</script></body></html>
